name: Android Build

# Cloud build: the maintainer's local machine has no Android SDK, so APK/AAB are built here.
# Debug APK always builds. The release AAB is signed only when keystore secrets exist;
# without them the release bundle is assembled unsigned (job still succeeds) so pipeline
# breakage is visible early. Play App Signing enrolment means Google re-signs uploads —
# you upload with your upload key (the keystore in these secrets).
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The gradle wrapper jar is not committed yet (generate once with `gradle wrapper`
      # on any machine with Gradle, then commit gradlew + gradle-wrapper.jar). Until then
      # CI uses the Gradle distribution from setup-gradle directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode keystore (only when secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release-key.jks"
          else
            echo "No keystore secret set - release AAB will be assembled unsigned."
          fi

      - name: Build release AAB
        env:
          JLPT_KEYSTORE_FILE: ${{ github.workspace }}/release-key.jks
          JLPT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          JLPT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JLPT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
